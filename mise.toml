[tools]
uv = "latest"
lefthook = "latest"

[settings]
python.uv_venv_auto = true

[tasks.format]
run = '''
#!/usr/bin/env nix
#! nix develop {{config_root}} --command bash
treefmt
nextflow lint -format -harshil-alignment .
'''

[tasks.clean]
run = [
  "rm -rf .nextflow*",
  "rm -rf work",
  "rm -rf results",
]
